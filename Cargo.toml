[package]
name = "garcia-patcher"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

